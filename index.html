<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1630" />
  <title>BLACKBOX — v0.2.0</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/desktop.css" />
  <link rel="stylesheet" href="./css/apps.css" />
  <link rel="stylesheet" href="./css/terminal.css" />
  <link rel="stylesheet" href="./css/transitions.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
</head>
<body>
  <div id="game" aria-live="polite">
    <section id="boot-screen" class="boot-screen">
      <div class="boot-card">
        <div class="boot-logo">NEXUS/OS</div>
        <p class="muted">Personal Computing Environment // v0.2.0</p>

        <div id="boot-home" class="boot-home">
          <div id="active-identity-summary" class="identity-summary hidden"></div>
          <button id="continue-button" class="boot-action hidden" type="button">Continue</button>
          <button id="new-identity-button" class="boot-action" type="button">New Identity</button>
          <button id="archives-button" class="boot-action hidden" type="button">Archived Identities</button>
          <p id="boot-status" class="boot-status muted"></p>
        </div>

        <div id="new-identity-panel" class="hidden">
          <button id="new-identity-back" class="boot-back" type="button">← Back</button>
          <form id="alias-form" class="alias-form">
            <label for="alias-input">Create your user alias</label>
            <input id="alias-input" name="alias" maxlength="18" autocomplete="off" autocapitalize="none" placeholder="ghost" required />
            <p id="new-identity-warning" class="boot-status muted"></p>
            <button type="submit">Create Identity</button>
          </form>
        </div>

        <div id="archives-panel" class="hidden">
          <button id="archives-back" class="boot-back" type="button">← Back</button>
          <h2 class="boot-section-title">Archived Identities</h2>
          <div id="archives-list" class="archives-list"></div>
        </div>
      </div>
    </section>

    <section id="desktop" class="desktop hidden" aria-label="Desktop">
      <div class="desktop-icons" id="desktop-icons"></div>
      <div id="window-layer" class="window-layer"></div>

      <aside id="notifications" class="notifications" aria-live="polite"></aside>

      <nav class="taskbar">
        <button id="start-button" class="taskbar-button">◈ Start</button>
        <div id="taskbar-apps" class="taskbar-apps"></div>
        <button id="clock-button" class="clock-button" title="Game time">
          <span id="clock-time">--:--</span>
          <span id="clock-date">----</span>
        </button>
      </nav>

      <div id="start-menu" class="start-menu hidden">
        <div class="start-user">
          <strong id="start-alias">user</strong>
          <span>Local account</span>
        </div>
        <div id="start-app-list" class="start-app-list"></div>
        <div class="start-footer">
          <button id="save-button">Save</button>
          <button id="blackbox-button">Enter BLACKBOX</button>
        </div>
      </div>
    </section>

    <section id="blackbox-transition" class="blackbox-transition hidden" aria-hidden="true">
      <div id="transition-lines" class="transition-lines"></div>
      <button id="skip-transition" class="skip-transition hidden">Skip</button>
    </section>

    <section id="blackbox" class="blackbox hidden" aria-label="BLACKBOX terminal">
      <div class="crt-overlay" aria-hidden="true"></div>
      <header class="blackbox-header">
        <div>
          <strong>BLACKBOX SECURE ENVIRONMENT</strong>
          <span id="bb-session-label">LOCAL SESSION</span>
        </div>
        <div class="bb-status">
          <span>LINK <b id="bb-link">LOCAL</b></span>
          <span>TRACE <b id="bb-trace">0%</b></span>
          <button id="bb-desktop-button" class="bb-desktop-button" type="button" aria-label="Return to desktop">DESKTOP</button>
        </div>
      </header>

      <main class="terminal-shell">
        <div id="terminal-output" class="terminal-output"></div>
        <form id="terminal-form" class="terminal-form" autocomplete="off">
          <span id="terminal-prompt" class="terminal-prompt">user@home:~$</span>
          <input id="terminal-input" class="terminal-input" spellcheck="false" autocomplete="off" autocapitalize="none" autocorrect="off" enterkeyhint="send" inputmode="text" aria-label="BLACKBOX command input" />
        </form>
      </main>


      <div id="bb-remote-modal" class="bb-modal hidden" role="dialog" aria-modal="true" aria-labelledby="bb-remote-title">
        <div class="bb-modal-card">
          <strong id="bb-remote-title">REMOTE SESSION ACTIVE</strong>
          <p>Disconnect before returning to NEXUS/OS?</p>
          <div class="bb-modal-actions">
            <button id="bb-remote-return" type="button">DISCONNECT &amp; RETURN</button>
            <button id="bb-remote-cancel" type="button">CANCEL</button>
          </div>
        </div>
      </div>

      <footer class="blackbox-footer">
        <span>BLACKBOX/0.1.3</span>
        <span>Type <b>help</b> for commands · <b>exit</b> to return</span>
      </footer>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
